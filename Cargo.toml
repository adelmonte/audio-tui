[package]
name = "audio-tui"
version = "0.2.1"
edition = "2024"
description = "A modern terminal mixer and control panel for PipeWire"
license = "GPL-3.0-or-later"
authors = ["adelmonte"]

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
libspa = "0.10"
libspa-sys = "0.10"
pipewire = { version = "0.10", features = ["v0_3_44"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "process"] }
toml = "1.2.3"
toml_edit = "0.25.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.3"

[profile.release]
lto = "thin"
strip = true
